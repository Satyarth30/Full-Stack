<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning forms</title>
</head>

<body>
    <h2>CR Application Form</h2>
</body>
<form action="/register" method="get">
    <label for="name">Username</label>
    <input type="text" name="username" placeholder="Enter your username" id="name" required minlength="2" maxlength="50" value="Satty"/>
    <br>
    <br>
    <label for="age">Age:</label>
    <input type="number" name="age" placeholder="Enter your age" id="age" min="0" />

    <br>
    <br>
    <label for="roll-no">Enter your roll no:</label>
    <input type="number" name="roll-no" placeholder="Enter your Roll-no" required maxlength="" />
    <br>
    <br>
    <label for="color">Whats ur fav color</label>
    <input type="color" id="color" name="colour">
    <br>
    <br>
    <label for="dob">Date of birth</label>
    <input type="date" id="dob" name="dob">
    <br>
    <br>
    <label for="Password">Password:</label>
    <input type="password" id="Password" name="Password" placeholder="Enter your password">
    <br>
    <br>
    <label for="Email">E-mail:</label>
    <input type="email" id="Email" name="Email" placeholder="Enter your Email">
    <br>
    <br>

    <button type="submit">Submit the form</button>
    <button type="reset">Reset the form</button>
    <br>
    <input type="submit" value="Submit the form">
    <input type="reset" value="Reset the form">

</form>

</html>
